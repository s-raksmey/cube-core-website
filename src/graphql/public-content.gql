query PublicWebsiteCategories($tenantId: ID!) {
  publicWebsiteCategories(tenantId: $tenantId) {
    id slug name translations { locale name }
    subcategories { slug translations { locale name } }
  }
}

query PublicWebsiteTags($tenantId: ID!) {
  publicWebsiteTags(tenantId: $tenantId) {
    slug name translations { locale name }
  }
}

query PublicWebsiteArticles($tenantId: ID!, $categorySlug: String, $subcategorySlug: String, $tagSlug: String, $search: String, $featured: Boolean, $breaking: Boolean, $page: Int, $pageSize: Int) {
  publicWebsiteArticles(tenantId: $tenantId, categorySlug: $categorySlug, subcategorySlug: $subcategorySlug, tagSlug: $tagSlug, search: $search, featured: $featured, breaking: $breaking, page: $page, pageSize: $pageSize) {
    items {
      id title slug summary category { id slug name translations { locale name } }
      subcategorySlug subcategory { slug translations { locale name } }
      isBreaking isFeatured featuredImageUrl publishedAt viewCount shareCount
      translations { locale title summary }
    }
    total page pageSize
  }
}

query PublicWebsiteArticle($tenantId: ID!, $slug: String!) {
  publicWebsiteArticle(tenantId: $tenantId, slug: $slug) {
    id title slug summary content viewCount shareCount category { id slug name translations { locale name } }
    subcategorySlug subcategory { slug translations { locale name } }
    isBreaking isFeatured featuredImageUrl publishedAt authorName
    translations { locale title summary content }
    tags { slug name translations { locale name } }
  }
}

query PublicWebsiteRelatedArticles($tenantId: ID!, $slug: String!, $limit: Int) {
  publicWebsiteRelatedArticles(tenantId: $tenantId, slug: $slug, limit: $limit) {
    id title slug summary category { id slug name translations { locale name } }
    subcategorySlug subcategory { slug translations { locale name } }
    isBreaking featuredImageUrl publishedAt viewCount shareCount translations { locale title summary }
  }
}

query PublicWebsitePopularArticles($tenantId: ID!, $limit: Int) {
  publicWebsitePopularArticles(tenantId: $tenantId, limit: $limit) {
    id title slug summary viewCount shareCount category { id slug name translations { locale name } }
    subcategorySlug subcategory { slug translations { locale name } }
    isBreaking featuredImageUrl publishedAt translations { locale title summary }
  }
}

mutation RecordPublicWebsiteArticleView($hostname: String!, $articleId: ID!, $visitorId: ID!) {
  recordPublicWebsiteArticleView(hostname: $hostname, articleId: $articleId, visitorId: $visitorId)
}

mutation RecordPublicWebsiteArticleShare($hostname: String!, $articleId: ID!, $visitorId: ID!, $platform: ArticleSharePlatform!) {
  recordPublicWebsiteArticleShare(hostname: $hostname, articleId: $articleId, visitorId: $visitorId, platform: $platform)
}
