query LocalDevelopmentTenant {
  localDevelopmentTenant {
    id
    name
    websiteLogoUrl
    publicWebsiteFaviconUrl
  }
  publicGeneralSettings(hostname: "localhost") {
    tenantId
    siteName
    siteDescription
    contactEmail
    phone
    secondaryPhone
    address
    website {
      maintenanceMode
      maintenanceMessage
    }
    socialLinks {
      platform
      url
    }
    seo {
      allowIndexing
      metaTitle
      metaDescription
      ogTitle
      ogDescription
      defaultOgImageUrl
    }
  }
}

query TenantByHostname($hostname: String!, $purpose: TenantDomainPurpose!) {
  tenantByHostname(hostname: $hostname, purpose: $purpose) {
    id
    name
    status
    websiteLogoUrl
    publicWebsiteFaviconUrl
  }
  publicGeneralSettings(hostname: $hostname) {
    tenantId
    siteName
    siteDescription
    contactEmail
    phone
    secondaryPhone
    address
    website {
      maintenanceMode
      maintenanceMessage
    }
    socialLinks {
      platform
      url
    }
    seo {
      allowIndexing
      metaTitle
      metaDescription
      ogTitle
      ogDescription
      defaultOgImageUrl
    }
  }
}
